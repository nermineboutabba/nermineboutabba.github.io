<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nermine Boutabba — Instant Document Download</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236D28D9'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='monospace' font-weight='bold' font-size='14' fill='white'%3ENB%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.22), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(109, 40, 217, 0.18), transparent 42%),
        radial-gradient(circle at 50% 90%, rgba(192, 132, 252, 0.2), transparent 45%),
        #faf7ff;
    }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-900">
  <main class="max-w-lg w-full bg-white/95 backdrop-blur-xl rounded-3xl border border-purple-200 shadow-2xl shadow-purple-900/10 p-6 sm:p-9 text-center space-y-6">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-[#4C1D95] via-[#7C3AED] to-[#A855F7] text-white font-extrabold text-xl flex items-center justify-center shadow-lg shadow-purple-500/30 font-mono-code">
      N<sub class="text-sm">B</sub>
    </div>

    <div class="space-y-2">
      <span id="doc-badge" class="inline-block px-3.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-purple-100 text-purple-800 border border-purple-200">
        Instant PDF Download
      </span>
      <h1 id="doc-title" class="text-2xl sm:text-3xl font-extrabold text-[#2E1065]">
        Downloading Document...
      </h1>
      <p id="doc-sub" class="text-sm text-slate-600 leading-relaxed">
        Your PDF from Nermine Boutabba's portfolio is downloading automatically to your device.
      </p>
    </div>

    <div id="status-box" class="rounded-2xl bg-purple-50/80 border border-purple-200 p-4 text-xs text-purple-900 font-medium">
      Preparing download...
    </div>

    <div class="space-y-3">
      <a id="manual-download-btn" href="assets/docs/CV-EN.pdf" download="Nermine_Boutabba_CV_EN.pdf" class="block w-full py-3.5 px-5 rounded-2xl text-sm font-bold text-white bg-gradient-to-r from-[#5B21B6] via-[#7C3AED] to-[#9333EA] hover:opacity-95 shadow-lg shadow-purple-500/25 transition-all">
        Download PDF Now
      </a>

      <a id="open-inline-btn" href="assets/docs/CV-EN.pdf" target="_blank" rel="noopener" class="block w-full py-3 px-5 rounded-2xl text-xs font-bold text-purple-900 bg-purple-50 hover:bg-purple-100 border border-purple-200 transition-colors">
        Open PDF in Browser
      </a>

      <a id="portfolio-back-btn" href="index.html" class="inline-flex items-center justify-center gap-1.5 text-xs font-bold text-purple-700 hover:text-purple-900 pt-2">
        &larr; <span id="portfolio-back-label">Explore Full Engineering Portfolio</span>
      </a>
    </div>

    <div class="pt-4 border-t border-purple-100 grid grid-cols-2 gap-2 text-xs">
      <a href="?doc=cv-en" class="py-2 px-3 rounded-xl bg-white border border-purple-200 hover:border-purple-400 font-semibold text-purple-900">CV (EN)</a>
      <a href="?doc=cv-fr" class="py-2 px-3 rounded-xl bg-white border border-purple-200 hover:border-purple-400 font-semibold text-purple-900">CV (FR)</a>
      <a href="?doc=dossier-en" class="py-2 px-3 rounded-xl bg-white border border-purple-200 hover:border-purple-400 font-semibold text-purple-900">Dossier (EN)</a>
      <a href="?doc=dossier-fr" class="py-2 px-3 rounded-xl bg-white border border-purple-200 hover:border-purple-400 font-semibold text-purple-900">Dossier (FR)</a>
    </div>
  </main>

  <script>
    (function () {
      const DOC_MAP = {
        "cv-en": {
          file: "assets/docs/CV-EN.pdf",
          filename: "Nermine_Boutabba_CV_EN.pdf",
          lang: "en",
          badge: "2026 ATS Resume • English",
          title: "Nermine Boutabba — CV (EN)",
          sub: "Your 2026 English ATS Resume PDF download has started automatically.",
          statusDownloading: "Starting automatic PDF download...",
          statusDone: "Download triggered! Check your browser Downloads folder or tap the button below if needed.",
          statusFallback: "Tap the purple button below to save the PDF to your phone.",
          btnDownload: "Download CV (EN) PDF",
          btnOpen: "View PDF in Browser",
          backLabel: "Explore Full Engineering Portfolio"
        },
        "cv-fr": {
          file: "assets/docs/CV-FR.pdf",
          filename: "Nermine_Boutabba_CV_FR.pdf",
          lang: "fr",
          badge: "CV ATS 2026 • Français",
          title: "Nermine Boutabba — CV (FR)",
          sub: "Le téléchargement automatique de votre CV 2026 en français vient de démarrer.",
          statusDownloading: "Démarrage du téléchargement automatique...",
          statusDone: "Téléchargement lancé ! Vérifiez vos téléchargements ou appuyez sur le bouton ci-dessous si besoin.",
          statusFallback: "Appuyez sur le bouton violet ci-dessous pour enregistrer le PDF sur votre téléphone.",
          btnDownload: "Télécharger le CV (FR) PDF",
          btnOpen: "Ouvrir le PDF dans le navigateur",
          backLabel: "Explorer le Portfolio Complet"
        },
        "dossier-en": {
          file: "assets/docs/APPLICATION-DOSSIER-EN.pdf",
          filename: "Nermine_Boutabba_Application_Dossier_EN.pdf",
          lang: "en",
          badge: "7-Page Full Application Pack • English",
          title: "Application Dossier (EN)",
          sub: "Includes 2026 Resume, Cover Letter, Knowledge Report & QR Portfolio links.",
          statusDownloading: "Starting automatic 7-page dossier download...",
          statusDone: "Download triggered! Check your browser Downloads folder or tap the button below if needed.",
          statusFallback: "Tap the purple button below to save the 7-page Dossier PDF.",
          btnDownload: "Download Application Dossier (EN)",
          btnOpen: "View Dossier in Browser",
          backLabel: "Explore Full Engineering Portfolio"
        },
        "dossier-fr": {
          file: "assets/docs/DOSSIER-DE-CANDIDATURE-FR.pdf",
          filename: "Nermine_Boutabba_Dossier_Candidature_FR.pdf",
          lang: "fr",
          badge: "Pack Complet 7 Pages • Français",
          title: "Dossier de Candidature (FR)",
          sub: "Inclut le CV 2026, Lettre de Motivation, Rapport de Connaissances et liens QR.",
          statusDownloading: "Démarrage du téléchargement du dossier complet...",
          statusDone: "Téléchargement lancé ! Vérifiez vos téléchargements ou appuyez sur le bouton ci-dessous si besoin.",
          statusFallback: "Appuyez sur le bouton violet ci-dessous pour enregistrer le Dossier PDF.",
          btnDownload: "Télécharger le Dossier Complet (FR)",
          btnOpen: "Ouvrir le Dossier dans le navigateur",
          backLabel: "Explorer le Portfolio Complet"
        }
      };

      const params = new URLSearchParams(window.location.search);
      const docKey = (params.get("doc") || "cv-en").toLowerCase();
      const info = DOC_MAP[docKey] || DOC_MAP["cv-en"];

      document.documentElement.lang = info.lang;
      document.title = `${info.title} — Nermine Boutabba`;
      document.getElementById("doc-badge").textContent = info.badge;
      document.getElementById("doc-title").textContent = info.title;
      document.getElementById("doc-sub").textContent = info.sub;

      const statusBox = document.getElementById("status-box");
      const dlBtn = document.getElementById("manual-download-btn");
      const openBtn = document.getElementById("open-inline-btn");
      const backLabel = document.getElementById("portfolio-back-label");

      statusBox.textContent = info.statusDownloading;
      dlBtn.href = info.file;
      dlBtn.setAttribute("download", info.filename);
      dlBtn.textContent = info.btnDownload;
      openBtn.href = info.file;
      openBtn.textContent = info.btnOpen;
      backLabel.textContent = info.backLabel;

      async function triggerAutoDownload() {
        try {
          if (window.location.protocol === "http:" || window.location.protocol === "https:") {
            const resp = await fetch(info.file);
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            const blob = await resp.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.style.display = "none";
            a.href = blobUrl;
            a.download = info.filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
              URL.revokeObjectURL(blobUrl);
              a.remove();
            }, 4000);
            statusBox.textContent = info.statusDone;
          } else {
            const a = document.createElement("a");
            a.href = info.file;
            a.download = info.filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            statusBox.textContent = info.statusDone;
          }
        } catch (err) {
          statusBox.textContent = info.statusFallback;
        }
      }

      setTimeout(triggerAutoDownload, 350);
    })();
  </script>
</body>
</html>
